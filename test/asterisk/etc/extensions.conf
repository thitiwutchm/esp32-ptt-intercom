[internal]
; echo back whatever is said
exten => 600,1,Answer()
 same => n,Echo()
; play a short recording, then hang up
exten => 601,1,Answer()
 same => n,Playback(vm-goodbye)
 same => n,Wait(1)
 same => n,Hangup()
; busy
exten => 602,1,Busy(3)
; ring the desk device and ask it to auto answer (same as the README)
exten => 200,1,Set(CALLERID(name)=Home Assistant)
 same => n,Set(CALLERID(num)=100)
 same => n,Dial(PJSIP/200,30,b(autoanswer^s^1))
 same => n,Hangup()

[autoanswer]
exten => s,1,Set(PJSIP_HEADER(add,Call-Info)=<sip:pbx>\;answer-after=0)
 same => n,Return()

[tone]
exten => s,1,Answer()
 same => n,Playtones(1000)
 same => n,Wait(3)
 same => n,Hangup()
