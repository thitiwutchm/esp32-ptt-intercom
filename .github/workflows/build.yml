name: build

on:
  push:
    tags: ["v*"]
    branches: ["**"]
  pull_request:

permissions:
  contents: write # publish factory images on version tags

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests and C/Python interop
        run: make -C test/host

  asterisk-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Asterisk
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y asterisk asterisk-core-sounds-en
      - name: SIP against a real Asterisk
        run: test/asterisk/run.sh
      - name: tools/sip_phone.py against the device's SIP stack
        run: test/softphone/run.sh

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    strategy:
      fail-fast: false
      matrix:
        board: [echoear, cube]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.board }}
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          defaults="sdkconfig.defaults"
          if [ "${{ matrix.board }}" = cube ]; then defaults="sdkconfig.defaults;sdkconfig.defaults.cube"; fi
          idf.py -B build-${{ matrix.board }} -D SDKCONFIG=build-${{ matrix.board }}/sdkconfig \
                 -D SDKCONFIG_DEFAULTS="$defaults" build
      - name: Factory image (one file at 0x0, for web.esphome.io / ESP Web Tools)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd build-${{ matrix.board }}
          python -m esptool --chip esp32s3 merge_bin -o ../esp32-ptt-intercom-${{ matrix.board }}-factory.bin @flash_args
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: |
            esp32-ptt-intercom-${{ matrix.board }}-factory.bin
            build-${{ matrix.board }}/bootloader/bootloader.bin
            build-${{ matrix.board }}/partition_table/partition-table.bin
            build-${{ matrix.board }}/esp32-ptt-intercom.bin
            build-${{ matrix.board }}/flash_args
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: esp32-ptt-intercom-${{ matrix.board }}-factory.bin
