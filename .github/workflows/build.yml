name: build

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests and C/Python interop
        run: make -C test/host

  asterisk-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Asterisk
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y asterisk asterisk-core-sounds-en
      - name: SIP against a real Asterisk
        run: test/asterisk/run.sh

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    strategy:
      fail-fast: false
      matrix:
        board: [echoear, cube]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.board }}
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          defaults="sdkconfig.defaults"
          if [ "${{ matrix.board }}" = cube ]; then defaults="sdkconfig.defaults;sdkconfig.defaults.cube"; fi
          idf.py -B build-${{ matrix.board }} -D SDKCONFIG=build-${{ matrix.board }}/sdkconfig \
                 -D SDKCONFIG_DEFAULTS="$defaults" build
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: |
            build-${{ matrix.board }}/bootloader/bootloader.bin
            build-${{ matrix.board }}/partition_table/partition-table.bin
            build-${{ matrix.board }}/esp32-ptt-intercom.bin
            build-${{ matrix.board }}/flash_args
