<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUBE · บันทึกการมาถึง</title>
<style>
  :root { color-scheme: light dark; --fg:#111; --bg:#fff; --mut:#666; --line:#ddd; --accent:#2563eb; --ok:#16a34a; --warn:#d97706; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --bg:#0b0d12; --mut:#9aa3b2; --line:#232838; --accent:#60a5fa; --ok:#4ade80; --warn:#fbbf24; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Noto Sans Thai", sans-serif; color:var(--fg); background:var(--bg); }
  .wrap { max-width: 820px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.25rem; margin: .2rem 0; }
  h2 { font-size: 1rem; margin: 1.4rem 0 .5rem; }
  .mut { color: var(--mut); font-size: .85rem; }
  .row { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
  button { font: inherit; padding:.5rem .8rem; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); cursor:pointer; }
  button.p { background:var(--accent); color:#fff; border-color:transparent; }
  table { width:100%; border-collapse: collapse; font-size:.9rem; }
  th, td { text-align:left; padding:.45rem .4rem; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mut); font-weight:600; }
  .pill { display:inline-block; padding:.05rem .5rem; border-radius:999px; font-size:.78rem; }
  .arrive { color:var(--ok); } .depart { color:var(--mut); } .enroll { color:var(--accent); }
  .dot { display:inline-block; width:.6rem; height:.6rem; border-radius:50%; margin-right:.35rem; }
  .on { background:var(--ok); } .off { background:var(--line); }
  code { font-size:.78rem; color:var(--mut); word-break:break-all; }
  a { color:var(--accent); }
  .empty { color:var(--mut); padding: .8rem 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>CUBE · บันทึกการมาถึงของมือถือ</h1>
  <div class="mut" id="status">กำลังโหลด…</div>

  <h2>มือถือที่ลงทะเบียน</h2>
  <div id="banner" class="mut"></div>
  <table><thead><tr><th></th><th>ชื่อ</th><th>สัญญาณ</th><th>IRK</th><th></th></tr></thead>
  <tbody id="peers"></tbody></table>
  <div class="row" style="margin-top:.7rem">
    <button class="p" id="add">+ เพิ่มมือถือ (เข้าโหมดจับคู่)</button>
  </div>
  <div class="mut" style="margin-top:.4rem">
    กดปุ่มนี้ แล้วบนมือถือเปิด Bluetooth ค้นหา “<span id="devname">CUBE</span>” แล้วกดจับคู่ ภายในเวลาที่กำหนด
  </div>

  <h2>ประวัติ <span class="mut" id="logcount"></span></h2>
  <table><thead><tr><th>เวลา</th><th>มือถือ</th><th>เหตุการณ์</th><th>สัญญาณ</th></tr></thead>
  <tbody id="log"></tbody></table>
  <div class="row" style="margin-top:.7rem">
    <a href="/presence.csv">ดาวน์โหลด CSV</a> ·
    <a href="/presence.json">JSON</a> ·
    <button id="clear">ล้างประวัติ</button>
  </div>
  <div class="mut" style="margin-top:1rem">รีเฟรชอัตโนมัติทุก 5 วินาที</div>
</div>
<script>
const EV = {0:["ลงทะเบียน","enroll"], 1:["มาถึง","arrive"], 2:["ออกไป","depart"]};
const $ = id => document.getElementById(id);
function esc(s){ return (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function rssi(v){ return v ? v+" dBm" : "—"; }

async function post(path, body){
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:body||""});
  return r.ok;
}

async function load(){
  let d;
  try { d = await (await fetch("/presence.json", {cache:"no-store"})).json(); }
  catch(e){ $("status").textContent = "เชื่อมต่อเครื่องไม่ได้"; return; }
  $("status").innerHTML = "เวลาเครื่อง: " + esc(d.now) + (d.time_valid ? "" : " <span class='warn'>(ยังไม่ได้ซิงค์เวลา)</span>");
  $("devname").textContent = d.name || "CUBE";
  $("banner").textContent = d.enrolling ? "⏳ กำลังเปิดให้จับคู่… เปิด Bluetooth บนมือถือแล้วเลือกเครื่องนี้" : "";

  $("peers").innerHTML = (d.peers||[]).map(p => `<tr>
    <td><span class="dot ${p.present?'on':'off'}"></span></td>
    <td>${esc(p.name)}</td>
    <td class="mut">${p.present?rssi(p.rssi):"ไม่อยู่ในระยะ"}</td>
    <td><code>${esc(p.irk)}</code></td>
    <td class="row">
      <button data-ren="${p.id}" data-name="${esc(p.name)}">เปลี่ยนชื่อ</button>
      <button data-forget="${p.id}">ลบ</button>
    </td></tr>`).join("") || `<tr><td colspan="5" class="empty">ยังไม่มีมือถือลงทะเบียน</td></tr>`;

  const log = d.log||[];
  $("logcount").textContent = log.length ? `(${log.length} รายการล่าสุด)` : "";
  $("log").innerHTML = log.map(r => {
    const [label,cls] = EV[r.event]||["?",""];
    return `<tr>
      <td>${esc(r.when)}${r.approx?' <span class="warn mut">~</span>':''}</td>
      <td>${esc(r.name)}</td>
      <td class="${cls}">${label}</td>
      <td class="mut">${rssi(r.rssi)}</td></tr>`;
  }).join("") || `<tr><td colspan="4" class="empty">ยังไม่มีประวัติ</td></tr>`;

  $("peers").querySelectorAll("[data-ren]").forEach(b => b.onclick = async () => {
    const name = prompt("ตั้งชื่อมือถือ", b.dataset.name);
    if (name && await post("/api/presence/rename", "id="+b.dataset.ren+"&name="+encodeURIComponent(name))) load();
  });
  $("peers").querySelectorAll("[data-forget]").forEach(b => b.onclick = async () => {
    if (confirm("ลบมือถือนี้ออกจากรายการ? (ประวัติเดิมยังอยู่)") && await post("/api/presence/forget", "id="+b.dataset.forget)) load();
  });
}

$("add").onclick = async () => { if (await post("/api/presence/enroll")) { $("banner").textContent = "⏳ กำลังเปิดให้จับคู่…"; setTimeout(load, 500); } };
$("clear").onclick = async () => { if (confirm("ล้างประวัติทั้งหมด?") && await post("/api/presence/clear")) load(); };

load();
setInterval(load, 5000);
</script>
</body>
</html>
